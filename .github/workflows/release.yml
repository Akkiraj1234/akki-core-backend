name: Release on Tag

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  validate-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Read tag and validate release.md
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          echo "TAG=$TAG" >> "$GITHUB_ENV"

          if [ ! -f release.md ]; then
            echo "release.md not found"
            exit 1
          fi

          if ! grep -qF "$TAG" release.md; then
            echo "release.md does not reference tag $TAG"
            exit 1
          fi

      - name: Ensure tag commit is on origin/stable
        run: |
          git fetch origin stable

          if ! git merge-base --is-ancestor "${GITHUB_SHA}" "origin/stable"; then
            echo "Tag commit ${GITHUB_SHA} is not on origin/stable"
            exit 1
          fi

      - name: Install Dependencies
        run: npm ci

      - name: Pack package
        run: |
          PKG=$(npm pack)
          echo "PKG=$PKG" >> "$GITHUB_ENV"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$TAG" \
            --title "$TAG" \
            --notes-file release.md \
            "$PKG"`